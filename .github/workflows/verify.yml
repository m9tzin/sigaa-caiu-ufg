name: Verify

# Checks that never deploy. Runs on every branch and on pull requests, so a schema
# mismatch or a type error is visible before it reaches main -- where the deploy
# workflow acts on it automatically.
#
# Deploy Worker can only be exercised by publishing a Worker, which is the wrong way to
# find out that a credential is broken. A token missing D1:Read went unnoticed for weeks
# on the sibling repo for exactly that reason: db:verify failed with 7403 on every
# deploy, warned, and shipped anyway.
#
# This repo is a fork of trindadetiago/sigaa-caiu, and GitHub does not run workflows on
# a fork until someone accepts them in the Actions tab -- so nothing here has ever run
# (one dispatch has sat queued since 2026-08-14). This file is in place for when that is
# turned on; until then the UFG worker is deployed by hand with npm run deploy.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      # Reports drift without blocking: this workflow runs on feature branches, where
      # the schema legitimately runs ahead of the database. The deploy workflow is the
      # one that blocks. What matters here is that the credential works at all -- an
      # exit 2 means the token still cannot read D1, and the deploy will refuse.
      - name: Verify database schema (report only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run db:verify
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::notice::Banco em dia com schema.sql, e o token consegue ler o D1."
          elif [ "$code" -eq 1 ]; then
            echo "::warning::O banco divergiu de schema.sql. Numa branch isso e esperado ate o schema ser aplicado; na main o deploy vai barrar."
          else
            echo "::error::db:verify nao conseguiu consultar o D1 (exit $code). O token do CI precisa de Account > D1 > Read, senao o deploy vai barrar."
            exit 1
          fi
